kind = "web"
previewPath = "/"
title = "Continental Thaligai"
description = "A premium editorial React website celebrating South Indian traditional food culture. Features a cinematic hero, interactive thaligai meal-building experience, regional food stories, ingredient exploration, and emotional storytelling. Submitted for the DEV Frontend Challenge: Comfort Food Edition."
version = "1.0.0"
id = "artifacts/continental-thaligai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20818

[services.development]
run = "pnpm --filter @workspace/continental-thaligai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/continental-thaligai", "run", "build" ]
serve = "static"
publicDir = "artifacts/continental-thaligai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20818"
BASE_PATH = "/"
